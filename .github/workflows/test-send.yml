name: test-send

# Envio manual de teste. Nao faz commit da base de dados: o estado gravado em
# `sent` por um teste deve ser revisto antes de entrar no repo. Para testar
# sem enviar nada, deixar dry_run = true (por omissao).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Destino do teste"
        type: choice
        options:
          - canal
          - privado
          - all
        default: privado
      limit:
        description: "Maximo de mensagens por chat"
        type: string
        default: "1"
      dry_run:
        description: "Dry-run (imprime sem enviar e sem gravar em sent)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: football-state
  cancel-in-progress: false

jobs:
  test-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar config/chats.yaml a partir dos secrets
        env:
          TELEGRAM_CHAT_CANAL: ${{ secrets.TELEGRAM_CHAT_CANAL }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
        run: |
          [ -n "$TELEGRAM_CHAT_CANAL" ] || { echo "secret ausente"; exit 1; }
          mkdir -p config
          {
            echo "chats:"
            echo "  - key: canal"
            echo "    chat_id: \"${TELEGRAM_CHAT_CANAL}\""
            echo "    kind: channel"
            echo "    content: results"
            echo "    silent: false"
            if [ -n "${TELEGRAM_CHAT_PRIVADO}" ]; then
              echo "  - key: privado"
              echo "    chat_id: \"${TELEGRAM_CHAT_PRIVADO}\""
              echo "    kind: private"
              echo "    content: results"
              echo "    silent: false"
            fi
          } > config/chats.yaml

      - name: Deliver de teste
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args="--limit ${LIMIT}"
          if [ "${ONLY}" != "all" ]; then
            args="${args} --only ${ONLY}"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args="${args} --dry-run"
          fi
          python app.py deliver ${args}
